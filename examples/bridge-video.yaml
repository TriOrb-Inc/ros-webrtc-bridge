# Topic bridging plus two on-demand H.264 video tracks.
#
# Video is opt-in and all-or-nothing: without `video`, `video_tracks` and `limits.video` the bridge
# behaves exactly as examples/bridge.yaml does and rejects any offer containing an m=video section.
#
# Every track names its encoder backend explicitly. There is no `auto` value and no fallback: if the
# selected backend cannot encode on this host, startup fails with the configuration path, the track
# and the backend named. Pick the backend that matches the host:
#
#   l4t_v4l2  nvvidconv + nvv4l2h264enc (Jetson L4T multimedia stack)
#   openh264  openh264enc (software, no GPU)
#   fixture   replays a recorded stream; for development and CI, needs no encoder at all
version: 1
robot_id: robot-01
limits:
  max_peers: 4
  max_message_bytes: 16384
  max_peer_queue_bytes: 262144
  max_channel_buffered_bytes: 65536
  video:
    max_tracks: 2
    # Never run more encoders at once than the host was sized for.
    max_pipelines: 2
    # m=video sections one peer may negotiate in a single offer.
    max_slots_per_peer: 2
    max_width: 1920
    max_height: 1080
    max_framerate: 30
topics:
  /odom:
    ros_type: nav_msgs/msg/Odometry
    direction: ros_to_web
    ros_qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 5
    delivery: realtime
    max_rate_hz: 20
    queue: { policy: latest, max_messages: 1 }
video:
  # An encoder that produces nothing within this window is treated as failed.
  start_timeout_ms: 5000
  # Keep the encoder running this long after the last viewer leaves, so a page reload is free.
  stop_grace_ms: 5000
  # Collapse bursts of RTCP PLI into one keyframe request.
  pli_min_interval_ms: 200
video_tracks:
  front:
    ros_topic: /camera/front/image_raw
    ros_type: sensor_msgs/msg/Image
    # Live video: transient_local would replay a stale frame into a running stream and is rejected.
    ros_qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 1
    # Frames whose encoding or geometry differ from this are rejected, never rescaled.
    input:
      encoding: rgb8
      width: 1280
      height: 720
      framerate: 30
    encoder:
      codec: h264
      backend: l4t_v4l2
      # Always bits per second; each backend converts to the unit its element expects.
      bitrate: 4000000
      keyframe_interval: 30
      profile: constrained_baseline
    # Unlisted scopes are denied: a client sees no catalog entry and cannot subscribe.
    access: { subscribe_scope: video.front }
  rear:
    ros_topic: /camera/rear/image_raw
    ros_type: sensor_msgs/msg/Image
    ros_qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 1
    input:
      encoding: bgr8
      width: 640
      height: 480
      framerate: 15
    encoder:
      codec: h264
      # A second track may select a different backend; each is probed independently at startup.
      backend: openh264
      bitrate: 1500000
      keyframe_interval: 15
      profile: constrained_baseline
    access: { subscribe_scope: video.rear }
